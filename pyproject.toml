[project]
name = "cmpe249-hw-detection"
version = "0.1.0"
description = "CMPE 249 HW: zero-shot 2D object detection evaluation across COCO and KITTI (Track A)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.8.0",
    "torchvision==0.23.0",
    "transformers==4.56.2",
    "ultralytics==8.3.203",
    "clip @ git+https://github.com/ultralytics/CLIP.git",
    "pycocotools==2.0.8",
    "opencv-python==4.12.0.88",
    "matplotlib==3.10.6",
    "pyarrow==21.0.0",
    "scipy==1.16.2",
    "timm==1.0.20",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
